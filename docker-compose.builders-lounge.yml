services:
  builders-lounge-renderer:
    image: ${BUILDERS_LOUNGE_IMAGE:-moneyprinterturbo-builders-lounge:local}
    pull_policy: build
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ${BUILDERS_LOUNGE_ENV_FILE:?BUILDERS_LOUNGE_ENV_FILE must point to an external env-file}
    command: ["python3", "main.py"]
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./config.toml:/MoneyPrinterTurbo/config.toml
      - ./storage:/MoneyPrinterTurbo/storage
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
